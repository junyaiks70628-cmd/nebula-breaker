<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05091d">
<title>NEBULA BREAKER</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05091d;color:#f4f8ff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;touch-action:none}#app{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom);background:radial-gradient(ellipse at top,#142a60,#05091d 65%)}header{display:flex;justify-content:space-between;align-items:center;padding:9px 0;gap:6px}.logo{font-size:13px;font-weight:900;color:#8deaff;text-shadow:0 0 12px #168dff;letter-spacing:1px}.stats{display:flex;gap:9px;text-align:center;color:#9eb9e9;font-size:10px}.stats b{display:block;font-size:16px;color:#fff}.pause{background:#14234a;color:white;border:1px solid #4b8de8;border-radius:9px;padding:8px 10px;font-size:16px}#arena{position:relative;flex:1;min-height:0;border:1px solid #3157a0;border-radius:15px;overflow:hidden;box-shadow:0 0 24px #087eff25}canvas{width:100%;height:100%;display:block}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#03081ddd;padding:22px;text-align:center}.panel{width:min(100%,340px)}h1{font-size:clamp(32px,9vw,44px);line-height:1.05;margin:0 0 12px;color:#8deaff;text-shadow:0 0 18px #168dff}.sub{color:#b6c9ef;font-size:13px;line-height:1.8;margin:12px 0 20px}.btn{width:100%;border:1px solid #6de7ff;border-radius:14px;padding:14px 12px;font-size:16px;font-weight:800;color:#03102b;background:linear-gradient(135deg,#65efff,#3d8bff);margin:6px 0}.btn.secondary{background:#101d42;color:#dceaff;border-color:#4366a9}.hint{font-size:11px;color:#90a9d6;line-height:1.8;margin-top:14px}footer{display:flex;justify-content:space-between;align-items:center;padding:9px 0;color:#8da7d9;font-size:11px}.pill{border:1px solid #294c8a;background:#0a1534;border-radius:999px;padding:6px 9px}
</style></head><body><div id="app">
<header><div class="logo">✦ NEBULA BREAKER</div><div class="stats"><div>STAGE<b id="stage">1</b></div><div>SCORE<b id="score">0</b></div><div>LIFE<b id="life">♥♥♥</b></div></div><button class="pause" id="pause">Ⅱ</button></header>
<div id="arena"><canvas id="game"></canvas><div id="overlay"><div class="panel"><h1>NEBULA<br>BREAKER</h1><div class="sub">星屑のブロックを撃ち砕け。<br>アイテムを集めて銀河を進もう。</div><button class="btn" id="start">GAME START</button><button class="btn secondary" id="how">遊び方</button><div class="hint">画面を左右にスライドしてバーを操作<br>通信不要・オフライン対応</div></div></div></div>
<footer><span class="pill" id="status">タップしてスタート</span><span>BEST <b id="best">0</b></span><span class="pill">NEON ARCADE</span></footer></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), canvas=$('game'),ctx=canvas.getContext('2d'),overlay=$('overlay');
let W=320,H=500,dpr=1,mode='title',stage=1,score=0,lives=3,best=0,bricks=[],balls=[],drops=[],particles=[],paddle={x:160,y:465,w:86,h:12},effects={wide:0,slow:0,fire:0},last=0,raf=0,audio=null;
try{best=Number(localStorage.getItem('nebulaBest')||0)}catch(e){} $('best').textContent=best;
const colors=['#ff5e89','#ff9b4a','#ffd85b','#5df0a5','#43caff','#9c80ff'];
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,2);W=Math.max(200,r.width);H=Math.max(300,r.height);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);paddle.y=H-34;paddle.x=Math.max(paddle.w/2,Math.min(W-paddle.w/2,paddle.x));draw()}
window.addEventListener('resize',resize);
function sound(f=440,d=.05){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.setValueAtTime(.04,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function hud(){
  $('stage').textContent=stage;
  $('score').textContent=score;
  const safeLives=Number.isFinite(lives)?Math.max(0,Math.min(5,Math.floor(lives))):0;
  $('life').textContent='♥'.repeat(safeLives)+'♡'.repeat(Math.max(0,3-safeLives));
  $('best').textContent=best;
}
function resetBall(){balls=[{x:paddle.x,y:paddle.y-12,vx:(Math.random()-.5)*3.2,vy:-4.2,r:6,fire:false}]}
function build(){bricks=[];drops=[];particles=[];effects={wide:0,slow:0,fire:0};const cols=8,rows=Math.min(4+Math.floor((stage-1)/2),7),gap=5,pad=10,bw=(W-pad*2-gap*(cols-1))/cols,bh=Math.max(15,Math.min(22,H*.035));for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){if(stage>2&&Math.random()<.07)continue;bricks.push({x:pad+c*(bw+gap),y:44+r*(bh+7),w:bw,h:bh,hp:stage>2&&r<2?2:1,color:colors[(r+Math.floor(c/2))%colors.length]})}paddle.w=86;paddle.x=W/2;paddle.y=H-34;resetBall();hud();draw()}
function show(title,desc,buttons){overlay.style.display='flex';overlay.innerHTML='<div class="panel"><h1>'+title+'</h1><div class="sub">'+desc+'</div>'+buttons.map((b,i)=>'<button class="btn '+(i?'secondary':'')+'" data-act="'+b.a+'">'+b.t+'</button>').join('')+'<div class="hint">画面を左右にスライドしてバーを動かす</div></div>';overlay.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>action(b.dataset.act)))}
function action(a){if(a==='start'||a==='retry'){if(a==='start'){stage=1;score=0;lives=3}build();mode='playing';overlay.style.display='none';$('status').textContent='PLAYING';last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}else if(a==='next'){stage++;build();mode='playing';overlay.style.display='none';$('status').textContent='STAGE '+stage;last=performance.now();raf=requestAnimationFrame(loop)}else if(a==='resume'){mode='playing';overlay.style.display='none';last=performance.now();raf=requestAnimationFrame(loop)}else if(a==='title'){mode='title';show('NEBULA<br>BREAKER','星屑のブロックを撃ち砕け。<br>アイテムを集めて銀河を進もう。',[{t:'GAME START',a:'start'},{t:'遊び方',a:'how'}])}else if(a==='how'){show('HOW TO PLAY','画面を左右にスライドしてバーを操作。ブロックを壊すとアイテムが落ちることがあります。<br><br>🔵 ボール増加　🟡 バー拡大<br>❤️ ライフ回復　🟣 ボール減速<br>🔥 貫通ボール',[{t:'ゲーム開始',a:'start'},{t:'タイトルへ戻る',a:'title'}])}}
$('start').addEventListener('click',()=>action('start'));$('how').addEventListener('click',()=>action('how'));
$('pause').addEventListener('click',()=>{if(mode==='playing'){mode='paused';show('PAUSED','休憩中。準備ができたら再開しよう。',[{t:'再開',a:'resume'},{t:'やり直す',a:'retry'},{t:'タイトルへ',a:'title'}])}else if(mode==='paused')action('resume')});
function move(x){const r=canvas.getBoundingClientRect();paddle.x=Math.max(paddle.w/2+2,Math.min(W-paddle.w/2-2,x-r.left));if(balls.length===1&&balls[0].y>paddle.y-25)balls[0].x=paddle.x}
canvas.addEventListener('pointerdown',e=>{move(e.clientX);if(mode==='serve')action('resume')});canvas.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')move(e.clientX)});
function burst(x,y,c,n=6){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,life:24,c})}
function itemDrop(x,y){if(Math.random()>.17)return;let ts=['multi','wide','life','slow','fire'];drops.push({x,y,vy:1.6,t:ts[Math.floor(Math.random()*ts.length)],r:10})}
function apply(d){sound(750,.12);if(d.t==='multi'){let add=[];balls.slice(0,3).forEach(b=>add.push({...b,vx:-b.vy*.7,vy:b.vx*.7},{...b,vx:b.vy*.7,vy:-b.vx*.7}));balls.push(...add.slice(0,4))}if(d.t==='wide'){effects.wide=6000;paddle.w=Math.min(W*.58,135)};if(d.t==='life')lives=Math.max(0,Math.min(5,(Number.isFinite(lives)?lives:0)+1));if(d.t==='slow')effects.slow=6000;if(d.t==='fire'){effects.fire=6000;balls.forEach(b=>b.fire=true)}burst(d.x,d.y,'#fff',10);hud()}
function loop(now){if(mode!=='playing')return;let dt=Math.min(32,now-last||16),s=dt/16.67;last=now;update(s,dt);draw();if(mode==='playing')raf=requestAnimationFrame(loop)}
function update(s,dt){for(let k of ['wide','slow','fire'])if(effects[k]>0)effects[k]-=dt;if(effects.wide<=0)paddle.w=86;if(effects.fire<=0)balls.forEach(b=>b.fire=false);let slow=effects.slow>0?.68:1;
for(let i=balls.length-1;i>=0;i--){let b=balls[i];b.x+=b.vx*s*slow;b.y+=b.vy*s*slow;if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)}if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)}if(b.y<b.r+4){b.y=b.r+4;b.vy=Math.abs(b.vy)}
if(b.vy>0&&b.y+b.r>=paddle.y&&b.y-b.r<=paddle.y+paddle.h&&b.x>=paddle.x-paddle.w/2&&b.x<=paddle.x+paddle.w/2){b.y=paddle.y-b.r;b.vx=((b.x-paddle.x)/(paddle.w/2))*5.2;b.vy=-Math.sqrt(Math.max(8,19+b.vx*b.vx));sound(390)}
for(let j=bricks.length-1;j>=0;j--){let q=bricks[j];if(b.x+b.r>q.x&&b.x-b.r<q.x+q.w&&b.y+b.r>q.y&&b.y-b.r<q.y+q.h){if(!b.fire){b.vy*=-1}q.hp--;if(q.hp<=0){bricks.splice(j,1);score+=10*stage;itemDrop(q.x+q.w/2,q.y+q.h/2);burst(q.x+q.w/2,q.y+q.h/2,q.color,5)}else q.color='#e6f4ff';sound(520,.04);break}}
if(b.y>H+20)balls.splice(i,1)}
for(let i=drops.length-1;i>=0;i--){let d=drops[i];d.y+=d.vy*s;if(d.y+d.r>=paddle.y&&d.x>=paddle.x-paddle.w/2&&d.x<=paddle.x+paddle.w/2){try}{apply(d)}catch(err){console.error('Item effect failed:',err)}finally{drops.splice(i,1)}else if(d.y>H+10)drops.splice(i,1)}
particles.forEach(p=>{p.x+=p.vx*s;p.y+=p.vy*s;p.life-=s});particles=particles.filter(p=>p.life>0);
if(!balls.length){lives--;hud();if(lives<=0){mode='over';if(score>best){best=score;try{localStorage.setItem('nebulaBest',best)}catch(e){}}hud();show('GAME OVER','SCORE<br><strong style="font-size:30px;color:white">'+score+'</strong><br>BEST '+best,[{t:'もう一度プレイ',a:'retry'},{t:'タイトルへ戻る',a:'title'}])}else{resetBall();mode='paused';show('BALL LOST','残りライフ：'+lives+'<br>続けよう。',[{t:'続ける',a:'resume'}])}return}
if(!bricks.length){score+=100*stage;mode='clear';if(score>best){best=score;try{localStorage.setItem('nebulaBest',best)}catch(e){}}hud();show('STAGE CLEAR!','STAGE '+stage+' COMPLETE<br><strong style="font-size:26px;color:#ffe87a">+'+(100*stage)+' BONUS</strong><br>スコア '+score,[{t:'次のステージへ',a:'next'},{t:'タイトルへ戻る',a:'title'}]);for(let i=0;i<30;i++)burst(Math.random()*W,Math.random()*H,colors[i%6],2)}}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function draw(){ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#071536');g.addColorStop(1,'#040817');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<60;i++){ctx.fillStyle='rgba(150,210,255,'+(.15+(i%4)*.1)+')';ctx.fillRect((i*97.13)%W,(i*53.77)%H,1.2,1.2)}
bricks.forEach(q=>{ctx.shadowBlur=9;ctx.shadowColor=q.color;ctx.fillStyle=q.color;rr(q.x,q.y,q.w,q.h,4);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#ffffff55';ctx.stroke()});
drops.forEach(d=>{let c={multi:'#39dfff',wide:'#ffd64f',life:'#ff6489',slow:'#b98cff',fire:'#ff8848'}[d.t];ctx.shadowBlur=12;ctx.shadowColor=c;ctx.fillStyle=c;ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#07122d';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText({multi:'●',wide:'↔',life:'+',slow:'Ⅱ',fire:'火'}[d.t],d.x,d.y)});
particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/24);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,3,3)});ctx.globalAlpha=1;balls.forEach(b=>{ctx.shadowBlur=16;ctx.shadowColor=b.fire?'#ff9d39':'#72f8ff';ctx.fillStyle=b.fire?'#ffd18b':'#eaffff';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0});
ctx.shadowBlur=18;ctx.shadowColor='#18bfff';let pg=ctx.createLinearGradient(paddle.x-paddle.w/2,paddle.y,paddle.x+paddle.w/2,paddle.y);pg.addColorStop(0,'#47a8ff');pg.addColorStop(.5,'#c6fbff');pg.addColorStop(1,'#47a8ff');ctx.fillStyle=pg;rr(paddle.x-paddle.w/2,paddle.y,paddle.w,paddle.h,7);ctx.fill();ctx.shadowBlur=0}
resize();draw();
})();
</script><script>if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js?v=3",{updateViaCache:"none"}).then(reg=>reg.update()).catch(()=>{})); }</script>
</body></html>
